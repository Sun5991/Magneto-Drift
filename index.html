<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Magneto Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070c;
    --steel1: #1c2330; --steel2: #10151f; --steel3: #0a0e16;
    --edge: #2e3a50; --edge-hi: rgba(255,255,255,.07);
    --text: #e3e9f5; --muted: #8796b0; --dim: #5d6b85;
    --cyan: #4fd6ff; --amber: #ffb547; --green: #5dff9e; --red: #ff5d5d; --violet: #a78bfa; --pink: #f472b6; --gold: #facc15;
    --into: #5b86ff; --out: #ffa63d;
    --head: "Orbitron", "Segoe UI", system-ui, sans-serif;
    --ui: "Rajdhani", "Segoe UI", system-ui, sans-serif;
    --mono: "Share Tech Mono", Consolas, "Courier New", monospace;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 15px/1.45 var(--body); user-select: none; }
  button { font: inherit; color: inherit; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
  #scan { position: fixed; inset: 0; pointer-events: none; z-index: 4;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }

  /* ---------- realistic console panels ---------- */
  .console { position: relative; background: linear-gradient(180deg, var(--steel1), var(--steel2)); border: 1px solid var(--edge);
    border-radius: 6px; box-shadow: inset 0 1px 0 var(--edge-hi), inset 0 -1px 0 rgba(0,0,0,.6), 0 10px 30px rgba(0,0,0,.55); }
  .console.screw:before, .console.screw:after { content: ""; position: absolute; top: 6px; width: 7px; height: 7px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #9aa6ba, #3a4456 60%, #1a202b); box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .console.screw:before { left: 6px; } .console.screw:after { right: 6px; }
  .phead { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font: 700 11px/1 var(--ui); letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--muted); border-bottom: 1px solid var(--edge); background: linear-gradient(180deg, rgba(255,255,255,.035), transparent); }
  .phead .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: blinkdot 2s infinite; }
  .phead .r { margin-left: auto; font-family: var(--mono); letter-spacing: 1px; color: var(--dim); }
  @keyframes blinkdot { 50% { opacity: .35; } }
  .screen-glass { background: #04070b; border: 1px solid #1e2838; border-radius: 4px; box-shadow: inset 0 0 18px rgba(0,0,0,.9); position: relative; overflow: hidden; }
  .screen-glass:after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.06), transparent 60%); }
  .mono { font-family: var(--mono); }
  .hazard { height: 6px; background: repeating-linear-gradient(-45deg, #f5b700 0 8px, #15181f 8px 16px); opacity: .85; }

  /* ---------- HUD ---------- */
  body:not(.playing) .hud { display: none !important; }
  #topbar { position: fixed; top: 0; left: 0; right: 0; height: 54px; z-index: 6; display: flex; align-items: stretch; gap: 0; border-radius: 0; border-left: 0; border-right: 0; }
  #topbar > div { display: flex; align-items: center; padding: 0 14px; border-right: 1px solid var(--edge); }
  #topbar .mis { flex: 1; min-width: 0; gap: 10px; }
  #topbar .mis .tag { font: 700 11px var(--ui); letter-spacing: 2px; color: #000; background: var(--amber); padding: 3px 7px; border-radius: 2px; white-space: nowrap; }
  #topbar .mis .nm { font: 700 17px var(--ui); letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .leds { gap: 6px; }
  .led { font: 700 11px var(--ui); letter-spacing: 1.5px; padding: 5px 8px; border-radius: 3px; border: 1px solid #2a3344; color: #4a566c; background: #0b0f17; white-space: nowrap; }
  .led.on-in { color: #cfe0ff; border-color: var(--into); background: rgba(91,134,255,.25); box-shadow: 0 0 12px rgba(91,134,255,.6), inset 0 0 8px rgba(91,134,255,.4); }
  .led.on-out { color: #fff1db; border-color: var(--out); background: rgba(255,166,61,.25); box-shadow: 0 0 12px rgba(255,166,61,.6), inset 0 0 8px rgba(255,166,61,.4); }
  .led.on-off { color: #b5c0d4; border-color: #4a566c; background: #151b27; }
  .led.on-pos { color: #ffd6d6; border-color: var(--red); background: rgba(255,93,93,.22); box-shadow: 0 0 10px rgba(255,93,93,.5); }
  .led.on-neg { color: #d6f6ff; border-color: var(--cyan); background: rgba(79,214,255,.2); box-shadow: 0 0 10px rgba(79,214,255,.5); }
  .tstats { gap: 18px; }
  .tstats div { text-align: center; }
  .tstats small { display: block; font: 700 10px var(--ui); letter-spacing: 2px; color: var(--dim); }
  .tstats b { font: 400 20px/1 var(--mono); color: var(--green); text-shadow: 0 0 8px rgba(93,255,158,.5); }
  #hScore { color: #facc15; text-shadow: 0 0 8px rgba(250,204,21,.5); display: inline-block; }
  #hScore.bump { animation: scBump .35s; } #hScore.drop { animation: scDrop .5s; }
  @keyframes scBump { 40% { transform: scale(1.35); } }
  @keyframes scDrop { 0%,60% { color: #ff5d5d; text-shadow: 0 0 10px #ff5d5d; } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } }
  .scoreline { text-align: center; margin: 2px 0 6px; } .scoreline b { font: 700 34px var(--mono); color: #facc15; text-shadow: 0 0 12px rgba(250,204,21,.5); }
  .scoreline small { display: block; font: 600 11px var(--ui); letter-spacing: 1px; color: var(--dim); }
  #pauseBtn { width: 40px; height: 36px; border-radius: 4px; border: 1px solid var(--edge); background: linear-gradient(180deg, #273042, #151b27); cursor: pointer; font-weight: 700; letter-spacing: -2px; }
  #pauseBtn:hover { border-color: var(--cyan); }

  #telemetry { position: fixed; top: 64px; left: 10px; width: 236px; z-index: 6; }
  #sensors { position: fixed; top: 64px; right: 10px; width: 236px; z-index: 6; }
  #gauge { width: 100%; height: 128px; display: block; }
  .readouts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 8px; }
  .readouts div { background: #070a10; border: 1px solid #1b2433; border-radius: 3px; padding: 3px 7px; }
  .readouts small { display: block; font: 700 9.5px var(--ui); letter-spacing: 1.5px; color: var(--dim); }
  .readouts b { font: 400 15px var(--mono); color: var(--cyan); text-shadow: 0 0 6px rgba(79,214,255,.45); white-space: nowrap; }
  .readouts .wide { grid-column: span 2; }
  .readouts .wide b { color: var(--amber); text-shadow: 0 0 6px rgba(255,181,71,.45); }
  .glasswrap { padding: 8px; }
  #mini { width: 100%; aspect-ratio: 1.6; display: block; }
  #radar { width: 100%; aspect-ratio: 1.45; display: block; }
  #scope { width: 100%; aspect-ratio: 1.9; display: block; }
  body.compact #sensors, body.compact #gauge, body.compact .mini-wrap { display: none; }

  #bossbar { position: fixed; top: 62px; left: 50%; transform: translateX(-50%); width: min(520px, calc(100% - 520px)); z-index: 6; padding: 8px 12px 10px; display: none; }
  body.playing.boss #bossbar { display: block; }
  .bbar { margin-top: 6px; }
  .bbar .lab { display: flex; justify-content: space-between; font: 700 11px var(--ui); letter-spacing: 2px; color: var(--muted); }
  .bbar .lab b { font: 400 13px var(--mono); color: var(--text); letter-spacing: 0; }
  .bbar .trk { height: 12px; background: #06080d; border: 1px solid #263044; border-radius: 2px; overflow: hidden; margin-top: 3px; }
  .bbar .trk i { display: block; height: 100%; width: 50%; transition: width .2s; }
  #coreBar { background: repeating-linear-gradient(90deg, #ff4d4d 0 10px, #c81e1e 10px 12px); box-shadow: 0 0 12px #ff4d4d; }
  #beamBar { background: repeating-linear-gradient(90deg, #4fd6ff 0 10px, #1e88b5 10px 12px); box-shadow: 0 0 12px #4fd6ff; }
  #bossPhase { font: 800 13px var(--head); letter-spacing: 3px; color: var(--red); text-align: center; }

  #toast { position: fixed; left: 50%; bottom: 128px; transform: translateX(-50%); padding: 8px 18px; border-radius: 3px; z-index: 7;
    background: rgba(8,11,17,.92); border: 1px solid var(--edge); border-left: 4px solid var(--cyan); font: 700 15px var(--ui); letter-spacing: .5px;
    opacity: 0; transition: opacity .25s; white-space: nowrap; pointer-events: none; }
  #toast.show { opacity: 1; }
  #banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%,-50%); text-align: center; z-index: 7; opacity: 0; transition: opacity .5s, transform .5s; pointer-events: none; }
  #banner.show { opacity: 1; transform: translate(-50%,-62%); }
  #banner .t1 { font: 700 14px var(--ui); letter-spacing: 8px; color: var(--amber); }
  #banner .t2 { font-family: var(--head); font-weight: 900; font-size: clamp(26px, 4.6vw, 52px); text-shadow: 0 0 30px rgba(79,214,255,.7); text-transform: uppercase; }
  #banner .ln { height: 2px; margin: 8px auto 0; width: 60%; background: linear-gradient(90deg, transparent, var(--amber), transparent); }

  .pad { position: fixed; bottom: 16px; width: 132px; height: 98px; z-index: 6; display: none; cursor: pointer; touch-action: none;
    border-radius: 8px; border: 1px solid #3a465c; background: linear-gradient(180deg, #2a3345, #141a25);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.6);
    flex-direction: column; align-items: center; justify-content: center; gap: 3px; transition: box-shadow .12s, transform .08s; }
  body.playing .pad { display: flex; }
  .pad .sym { font-size: 30px; line-height: 1; }
  .pad small { font: 700 11px var(--ui); letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }
  .pad .key { position: absolute; top: 6px; right: 8px; font: 11px var(--mono); color: var(--dim); }
  #padL { left: 16px; } #padR { right: 16px; }
  #padK { left: 50%; transform: translateX(-50%); width: 150px; display: none !important; }
  body.playing.boss #padK { display: flex !important; }
  #padL.on { transform: translateY(2px); border-color: var(--into); box-shadow: 0 0 26px var(--into), inset 0 0 22px rgba(91,134,255,.45); }
  #padR.on { transform: translateY(2px); border-color: var(--out); box-shadow: 0 0 26px var(--out), inset 0 0 22px rgba(255,166,61,.45); }
  #padK.ready { border-color: var(--green); box-shadow: 0 0 30px var(--green), inset 0 0 24px rgba(93,255,158,.45); }
  #padK.on { transform: translateX(-50%) translateY(2px); }

  #tut { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(560px, calc(100% - 320px)); z-index: 6; display: none; }
  body.playing.tutorial #tut { display: block; }
  #tut .in { display: flex; gap: 12px; align-items: center; padding: 10px 12px; }
  #tut .mascot { width: 66px; flex: none; }
  #tut .txt { flex: 1; font-size: 14px; }
  #tut .bar { height: 6px; background: #06080d; border: 1px solid #263044; border-radius: 2px; margin-top: 8px; overflow: hidden; }
  #tut .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--green)); box-shadow: 0 0 10px var(--cyan); }
  #tut .dots { display: flex; gap: 5px; margin-top: 6px; }
  #tut .dots span { width: 16px; height: 4px; background: #263044; }
  #tut .dots span.on { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }

  /* ---------- full screens ---------- */
  .screen { position: fixed; inset: 0; display: none; z-index: 10; overflow: auto; }
  .screen.show { display: block; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 18px 18px 40px; }
  .titlebar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding: 10px 12px; }
  .titlebar h2 { margin: 0; font: 800 20px var(--head); letter-spacing: 2px; flex: 1; text-transform: uppercase; }
  .titlebar h2 small { display: block; font: 600 12px var(--ui); letter-spacing: 3px; color: var(--muted); }
  .cbtn { padding: 8px 14px; border-radius: 4px; border: 1px solid #3a465c; background: linear-gradient(180deg, #2a3345, #161c28); cursor: pointer;
    font: 700 14px var(--ui); letter-spacing: 1px; text-transform: uppercase; box-shadow: inset 0 1px 0 rgba(255,255,255,.1); white-space: nowrap; }
  .cbtn:hover { border-color: var(--cyan); color: #fff; }
  .cbtn.primary { background: linear-gradient(180deg, #2fb8f0, #1477a8); border-color: #5fd8ff; color: #021018; box-shadow: 0 0 18px rgba(79,214,255,.35), inset 0 1px 0 rgba(255,255,255,.35); }
  .cbtn.warn { background: linear-gradient(180deg, #ffbf5a, #c07a12); border-color: #ffd28a; color: #1a0f00; }
  .cbtn.danger { border-color: rgba(255,93,93,.6); color: var(--red); }
  .cbtn:disabled { opacity: .4; cursor: not-allowed; }

  /* main menu */
  #menu { overflow: hidden; }
  .mgrid { height: 100%; display: grid; grid-template-columns: 340px 1fr 330px; grid-template-rows: auto 1fr auto; gap: 12px; padding: 12px; }
  .mtop { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 8px 14px; }
  .mtop .sys { font: 600 12px var(--mono); color: var(--muted); display: flex; gap: 18px; flex-wrap: wrap; }
  .mtop .sys b { color: var(--green); font-weight: 400; }
  .mtop .ver { margin-left: auto; font: 12px var(--mono); color: var(--dim); }
  .mleft { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .logo { padding: 18px 16px 14px; text-align: left; }
  .logo .row { display: flex; align-items: center; gap: 12px; }
  .logo svg { width: 64px; height: 64px; flex: none; }
  .logo h1 { margin: 0; font-family: var(--head); font-weight: 900; line-height: .95; letter-spacing: 2px; font-size: 36px; }
  .logo h1 .a { background: linear-gradient(90deg, #4fd6ff, #a78bfa 55%, #f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px rgba(124,140,255,.5)); }
  .logo h1 .b { display: block; color: transparent; -webkit-text-stroke: 1.5px #e3e9f5; letter-spacing: 9px; font-size: .72em; margin-top: 4px; }
  .logo p { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
  .nav { display: flex; flex-direction: column; padding: 6px; gap: 6px; }
  .nbtn { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 4px; cursor: pointer; text-align: left;
    border: 1px solid #2a3446; background: linear-gradient(180deg, #1e2635, #121824); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); transition: border-color .15s, transform .15s, box-shadow .15s; }
  .nbtn:hover, .nbtn:focus-visible { border-color: var(--cyan); transform: translateX(4px); box-shadow: 0 0 18px rgba(79,214,255,.2), inset 0 1px 0 rgba(255,255,255,.06); outline: none; }
  .nbtn .no { font: 14px var(--mono); color: var(--amber); }
  .nbtn .lb { font: 700 17px var(--ui); letter-spacing: 1px; text-transform: uppercase; }
  .nbtn .lb small { display: block; font: 500 12px var(--body); letter-spacing: 0; text-transform: none; color: var(--muted); }
  .nbtn .ar { color: var(--dim); }
  .nbtn.primary { border-color: rgba(79,214,255,.55); background: linear-gradient(90deg, rgba(79,214,255,.18), rgba(167,139,250,.12)), linear-gradient(180deg, #1e2635, #121824); }
  .mcenter { position: relative; min-height: 0; }
  .feed { position: absolute; inset: 0; border: 1px solid rgba(79,214,255,.18); border-radius: 4px; pointer-events: none; }
  .feed i { position: absolute; width: 22px; height: 22px; border-color: var(--cyan); border-style: solid; opacity: .8; }
  .feed i:nth-child(1) { top: -1px; left: -1px; border-width: 2px 0 0 2px; } .feed i:nth-child(2) { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .feed i:nth-child(3) { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; } .feed i:nth-child(4) { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  .feed .lbl { position: absolute; top: 10px; left: 14px; font: 12px var(--mono); color: var(--cyan); letter-spacing: 1px; }
  .feed .rec { position: absolute; top: 10px; right: 14px; font: 12px var(--mono); color: var(--red); }
  .feed .rec:before { content: "● "; animation: blinkdot 1s infinite; }
  .feed .cap { position: absolute; bottom: 10px; left: 14px; right: 14px; font: 12px var(--mono); color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .mright { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; }
  .prog { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .prow { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
  .prow .n { font: 12px var(--mono); color: var(--amber); }
  .prow .s { color: var(--gold); letter-spacing: 1px; font-size: 12px; }
  .prow .s.off { color: #39435a; }
  .pbar { height: 4px; background: #0b0f17; border-radius: 2px; overflow: hidden; grid-column: 2 / 4; margin-top: -3px; }
  .pbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--violet)); }
  .consts { padding: 8px 10px; display: grid; gap: 4px; font: 13px var(--mono); }
  .consts div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed #222b3b; padding: 3px 0; }
  .consts span { color: var(--muted); } .consts b { font-weight: 400; color: var(--cyan); }
  .profbox { display: flex; gap: 10px; padding: 10px; align-items: center; }
  .profbox .mascot { width: 84px; flex: none; animation: bob 3.2s ease-in-out infinite; }
  .profbox .fact { font-size: 13px; color: #cfd8ea; }
  .profbox .fact b { display: block; font: 700 11px var(--ui); letter-spacing: 2px; color: var(--gold); margin-bottom: 3px; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .ticker { grid-column: 1 / -1; overflow: hidden; white-space: nowrap; padding: 7px 0; font: 13px var(--mono); color: var(--muted); }
  .ticker span { display: inline-block; padding-left: 100%; animation: tick 70s linear infinite; }
  .ticker em { color: var(--amber); font-style: normal; margin: 0 18px; }
  @keyframes tick { to { transform: translateX(-100%); } }
  @media (max-width: 1100px) { .mgrid { grid-template-columns: 320px 1fr; } .mright { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; } .mright > * { flex: 1 1 280px; } #menu { overflow: auto; } .mgrid { height: auto; min-height: 100%; } .mcenter { min-height: 260px; } }
  @media (max-width: 720px) { .mgrid { grid-template-columns: 1fr; } .mcenter { min-height: 200px; } }

  /* mascot internals */
  .mascot .eye { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .mascot .orb { animation: spin 6s linear infinite; transform-origin: 60px 64px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* mission select */
  .sect { font: 700 13px var(--ui); letter-spacing: 3px; color: var(--amber); margin: 18px 2px 10px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
  .sect:after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--edge), transparent); }
  .mgrid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .mcard { padding: 0; overflow: hidden; cursor: pointer; text-align: left; transition: transform .15s, border-color .15s, box-shadow .15s; }
  .mcard:hover { transform: translateY(-3px); border-color: var(--c, var(--cyan)); box-shadow: 0 12px 30px rgba(0,0,0,.5), 0 0 22px var(--glow, transparent); }
  .mcard .th { position: relative; }
  .mcard canvas { width: 100%; aspect-ratio: 16/9; display: block; }
  .mcard .badge { position: absolute; top: 8px; left: 8px; font: 700 11px var(--ui); letter-spacing: 2px; padding: 3px 7px; background: var(--amber); color: #000; border-radius: 2px; }
  .mcard .badge.boss { background: var(--red); color: #fff; box-shadow: 0 0 12px var(--red); }
  .mcard .info { padding: 10px 12px 12px; }
  .mcard h3 { margin: 0 0 6px; font: 700 18px var(--ui); letter-spacing: .5px; text-transform: uppercase; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { font: 12px var(--mono); padding: 2px 7px; border: 1px solid #2c3850; border-radius: 2px; color: #b8c6de; background: #0b1019; }
  .mmeta { display: flex; align-items: center; gap: 10px; font: 12px var(--mono); color: var(--muted); }
  .mmeta .st { color: var(--gold); letter-spacing: 1px; margin-left: auto; font-size: 14px; }
  .diff { display: inline-flex; gap: 2px; } .diff i { width: 6px; height: 10px; background: #263044; } .diff i.on { background: var(--amber); box-shadow: 0 0 5px var(--amber); }

// =====================================================================
//  PHYSICS
//  Screen coordinates (y down). B along z: negative = ⊗ into screen, positive = ⊙ out.
//  F = q·B·(−vy, vx). Each step rotates v by (q·B/m)·dt, which keeps |v| exactly
//  constant, because the magnetic force does no work.
// =====================================================================
function rotateVelocity(p, B, dt) {
  const phi = (p.q * B / p.m) * dt, c = Math.cos(phi), s = Math.sin(phi);
  const vx = p.vx * c - p.vy * s, vy = p.vx * s + p.vy * c;
  p.vx = vx; p.vy = vy;
}
const forceVec = (p, B) => [p.q * B * -p.vy, p.q * B * p.vx];   // mC·T·m/s = mN
const speed = p => Math.hypot(p.vx, p.vy);
const radius = (p, B) => B === 0 ? Infinity : p.m * speed(p) / (Math.abs(p.q) * Math.abs(B));
const setSpeed = (p, v) => { const s = speed(p); p.vx *= v / s; p.vy *= v / s; };

// =====================================================================
//  SOUND (Web Audio synthesis)
// =====================================================================
const Sound = {
  ac: null, sfxG: null, musG: null, hum: null, humG: null, next: 0, step: 0,
  init() {
    if (this.ac) { if (this.ac.state === "suspended") this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ac = this.ac = new AC();
    this.sfxG = ac.createGain(); this.sfxG.connect(ac.destination);
    this.musG = ac.createGain(); this.musG.connect(ac.destination);
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500;
    this.hum = ac.createOscillator(); this.hum.type = "sawtooth"; this.hum.frequency.value = 110;
    this.humG = ac.createGain(); this.humG.gain.value = 0;
    this.hum.connect(lp); lp.connect(this.humG); this.humG.connect(this.sfxG); this.hum.start();
    this.volume(); this.next = ac.currentTime + .1;
    setInterval(() => this.music(), 200);
  },
  volume() { if (!this.ac) return; this.sfxG.gain.value = SET.sfx; this.musG.gain.value = SET.music * .55; },
  tone(f, d, type = "sine", v = .2, f2, delay = 0) {
    if (!this.ac) return;
    const t = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0005, t + d);
    o.connect(g); g.connect(this.sfxG); o.start(t); o.stop(t + d + .05);
  },
  noise(d, v = .3) {
    if (!this.ac) return;
    const ac = this.ac, n = Math.floor(ac.sampleRate * d), buf = ac.createBuffer(1, n, ac.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = "lowpass"; f.frequency.setValueAtTime(2000, ac.currentTime); f.frequency.exponentialRampToValueAtTime(100, ac.currentTime + d);
    g.gain.value = v; s.buffer = buf; s.connect(f); f.connect(g); g.connect(this.sfxG); s.start();
  },
  play(k) {
    switch (k) {
      case "click": this.tone(660, .07, "square", .05); this.tone(1320, .05, "sine", .05, null, .02); break;
      case "orb": this.tone(880, .12, "triangle", .18); this.tone(1320, .2, "triangle", .15, null, .07); break;
      case "crash": this.noise(.5, .45); this.tone(160, .4, "sawtooth", .12, 40); break;
      case "hit": this.noise(.25, .3); this.tone(300, .2, "square", .08, 120); break;
      case "accel": this.tone(300, .35, "sawtooth", .08, 1200); break;
      case "decel": this.tone(1000, .35, "sawtooth", .08, 250); break;
      case "kick": this.tone(220, .25, "sawtooth", .1, 880); this.tone(1760, .12, "sine", .08, null, .05); break;
      case "flip": this.tone(500, .12, "square", .07, 900); this.tone(900, .12, "square", .07, 500, .12); break;
      case "check": this.tone(740, .15, "sine", .15); this.tone(988, .2, "sine", .13, null, .1); break;
      case "win": [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .35, "triangle", .18, null, i * .11)); break;
      case "boom": this.noise(1.4, .6); this.tone(90, 1.2, "sawtooth", .2, 30); break;
      case "alarm": this.tone(880, .18, "square", .06); this.tone(660, .18, "square", .06, null, .2); break;
      case "wrong": this.tone(220, .3, "square", .08, 160); break;
      case "step": this.tone(988, .1, "sine", .12); this.tone(1319, .18, "sine", .1, null, .08); break;
    }
  },
  setHum(B) {
    if (!this.ac) return;
    const t = this.ac.currentTime;
    this.humG.gain.setTargetAtTime(B ? .07 : 0, t, .05);
    this.hum.frequency.setTargetAtTime(B < 0 ? 98 : 131, t, .05);
  },
  music() {
    if (!this.ac || SET.music <= 0) return;
    const ac = this.ac, chords = [[220, 261.63, 329.63], [174.61, 220, 261.63], [196, 246.94, 293.66], [164.81, 207.65, 246.94]];
    while (this.next < ac.currentTime + .5) {
      const t = this.next, ch = chords[Math.floor(this.step / 16) % 4];
      if (this.step % 16 === 0) ch.forEach(f => {
        const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.value = f / 2;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.07, t + 1.5); g.gain.linearRampToValueAtTime(0, t + 4.2);
        o.connect(g); g.connect(this.musG); o.start(t); o.stop(t + 4.3);
      });
      if (this.step % 2 === 0) {
        const f = ch[(this.step / 2) % 3] * (this.step % 8 < 4 ? 2 : 4);
        const o = ac.createOscillator(), g = ac.createGain(); o.type = "triangle"; o.frequency.value = f;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.035, t + .02); g.gain.exponentialRampToValueAtTime(.0005, t + .6);
        o.connect(g); g.connect(this.musG); o.start(t); o.stop(t + .65);
      }
      this.next += .25; this.step++;
    }
  }
};

function addScore(d, x, y) { if (d < 0) penN++; score += d; if (x != null) popup(x, y, (d > 0 ? "+" : "−") + Math.abs(d), d > 0 ? "#facc15" : "#ff5d5d"); const e = $("hScore"); if (e) { e.classList.remove("bump", "drop"); void e.offsetWidth; e.classList.add(d > 0 ? "bump" : "drop"); } }

function levelDef() { return mode === "tut" ? TUTORIAL : mode === "boss" ? BOSS : mode === "custom" ? customRef : LEVELS[lvlIdx]; }

// m: "tut" | "level" | "boss" | "custom"
function loadLevel(m, idx, custom) {
  mode = m; lvlIdx = idx; if (custom) customRef = custom;
  cur = levelDef(); theme = THEMES[cur.theme] || THEMES[0];
  document.body.classList.toggle("tutorial", mode === "tut");
  document.body.classList.toggle("boss", mode === "boss");
  crashes = 0; collected = 0; score = 0; penN = 0; timeT = 0; tutStep = 0; tutHold = 0; hist = []; popups = [];
  stats = { dist: 0, maxV: 0, maxF: 0, fieldT: 0 };
  sparks = []; trail = [];
  if (mode === "boss") { setupBoss(); return; }
  boss = null;
  mapH = cur.map.length; mapW = Math.max(...cur.map.map(r => r.length));
  grid = cur.map.map(r => r.padEnd(mapW, "#").split(""));
  orbs = []; cpActive = "";
  const ex = []; let start = null;
  for (let y = 0; y < mapH; y++) for (let x = 0; x < mapW; x++) {
    const c = grid[y][x];
    if (c === "o") { orbs.push({ x: x + .5, y: y + .5, got: false, ph: Math.random() * 6 }); grid[y][x] = "."; }
    if (c === "S") { start = { x: x + .5, y: y + .5 }; grid[y][x] = "."; }
    if (c === "E") ex.push([x + .5, y + .5]);
  }
  if (!start) start = { x: 1.5, y: 1.5 };
  portal = ex.length ? { x: ex.reduce((s, e) => s + e[0], 0) / ex.length, y: ex.reduce((s, e) => s + e[1], 0) / ex.length,
    bits: Array.from({ length: 40 }, () => ({ a: Math.random() * 6.28, r: Math.random(), s: .5 + Math.random() })) } : null;
  checkpoint = { x: start.x, y: start.y, vx: cur.v, vy: 0, q: cur.q };
  dust = Array.from({ length: Math.round(mapW * mapH / 6) }, () => ({ x: Math.random() * mapW, y: Math.random() * mapH,
    vx: (Math.random() - .5) * .15, vy: (Math.random() - .5) * .15, r: .02 + Math.random() * .05, ph: Math.random() * 6 }));

}

function respawn() {
  P = { x: checkpoint.x, y: checkpoint.y, vx: checkpoint.vx, vy: checkpoint.vy, q: checkpoint.q, m: cur.m };
  trail = []; lastCell = mode === "boss" ? "" : cellAt(P.x, P.y);
}

function cellAt(x, y) {
  const gx = Math.floor(x), gy = Math.floor(y);
  if (gx < 0 || gy < 0 || gx >= mapW || gy >= mapH) return "#";
  return grid[gy][gx];
}
const orbsActive = () => mode !== "tut" || tutStep >= 5;
const portalActive = () => !!portal && (mode !== "tut" || tutStep >= 6);

// =====================================================================
//  UPDATE (normal missions)
// =====================================================================
const R_P = 0.22, SUB = 0.002;
function update(dtReal) {
  if (state !== "play") return;
  const dt = dtReal * SET.speed;
  if (deadT > 0) { deadT -= dtReal; if (deadT <= 0) respawn(); return; }
  if (mode === "boss") { updateBoss(dt); return; }
  Bnow = (keyR ? cur.B : 0) - (keyL ? cur.B : 0);
  if (mode === "tut") tutorialTick(dt);
  if (mode === "tut" && TUT_STEPS[tutStep].kind === "btn") return;
  timeT += dt; trackStats(dt);
  const n = Math.ceil(dt / SUB), h = dt / n;
  for (let i = 0; i < n; i++) {
    rotateVelocity(P, Bnow, h);
    P.x += P.vx * h; P.y += P.vy * h;
    for (let a = 0; a < 8; a++) {
      const ang = a * Math.PI / 4;
      if (cellAt(P.x + Math.cos(ang) * R_P, P.y + Math.sin(ang) * R_P) === "#") { crash(); return; }
    }
    const c = cellAt(P.x, P.y);
    if (c !== lastCell) {
      if (c === "A") { setSpeed(P, Math.min(4.5, speed(P) * 1.5)); toast(T("accel"), "#5dff9e"); burst(P.x, P.y, "#5dff9e", 30); Sound.play("accel"); flash = { c: "93,255,158", t: .4 }; }
      if (c === "D") { setSpeed(P, Math.max(3, speed(P) / 1.5)); toast(T("decel"), "#c084fc"); burst(P.x, P.y, "#c084fc", 30); Sound.play("decel"); flash = { c: "192,132,252", t: .4 }; }
      if (c === "F") { P.q = -P.q; toast(T("flip")(P.q), "#f472b6"); burst(P.x, P.y, "#f472b6", 40); Sound.play("flip"); flash = { c: "244,114,182", t: .4 }; }
      if (c === "C") {
        const key = Math.floor(P.x) + "," + Math.floor(P.y);
        checkpoint = { x: P.x, y: P.y, vx: P.vx, vy: P.vy, q: P.q };
        if (cpActive !== key) { cpActive = key; toast(T("checkpoint"), "#4fd6ff"); Sound.play("check"); burst(P.x, P.y, "#4fd6ff", 20); }
      }
      if (c === "E" && portalActive()) { levelDone(); return; }
      lastCell = c;
    }
  }
  if (orbsActive()) for (const o of orbs) if (!o.got && Math.hypot(o.x - P.x, o.y - P.y) < 0.6) {
    o.got = true; collected++; burst(o.x, o.y, "#facc15", 22); Sound.play("orb"); addScore(PTS_ORB, o.x, o.y - .4);
  }
  trail.push([P.x, P.y]); if (trail.length > 110) trail.shift();
}

function trackStats(dt) {
  const v = speed(P), F = Math.abs(P.q) * v * Math.abs(Bnow);
  stats.dist += v * dt; stats.maxV = Math.max(stats.maxV, v); stats.maxF = Math.max(stats.maxF, F);
  if (Bnow) stats.fieldT += dt;
  hist.push([F, v]); if (hist.length > 220) hist.shift();
}

function crash() {
  crashes++; addScore(-PTS_CRASH, P.x, P.y - .5); deadT = 1.0; if (SET.shake) shake = .4;
  burst(P.x, P.y, P.q > 0 ? "#ff6b6b" : "#4dd8ff", 60); burst(P.x, P.y, "#ffffff", 20);
  toast(T("crash"), "#ff5d5d"); Sound.play("crash"); flash = { c: "255,93,93", t: .35 };
}
function burst(x, y, color, n) {
  const m = SET.hq ? n : Math.ceil(n / 2);
  for (let i = 0; i < m; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 5;
    sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .5 + Math.random() * .7, color, sz: 2 + Math.random() * 3 });
  }
}
function popup(x, y, text, color) { popups.push({ x, y, text, color, life: 1.2 }); }

let toastTimer = 0;
function toast(msg, color) {
  const t = $("toast");
  t.textContent = msg; t.style.borderLeftColor = color || ""; t.style.color = color || "";
  t.classList.add("show"); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2300);
}
let bannerTimer = 0;
function banner(t1, t2) {
  $("bannerT1").textContent = t1; $("bannerT2").textContent = t2;
  $("banner").classList.add("show"); clearTimeout(bannerTimer); bannerTimer = setTimeout(() => $("banner").classList.remove("show"), 2200);
}

// ---- tutorial ----
function tutorialTick(dt) {
  const st = TUT_STEPS[tutStep]; let need = 0;
  if (st.kind === "holdL") { need = 1.3; if (keyL && !keyR) tutHold += dt; }
  if (st.kind === "holdR") { need = 1.3; if (keyR && !keyL) tutHold += dt; }
  if (st.kind === "free") { need = 1.6; if (!keyL && !keyR) tutHold += dt; else tutHold = 0; }
  if (st.kind === "orbs") { need = 1; tutHold = collected >= orbs.length ? 1 : collected / orbs.length; }
  if (need && tutHold >= need) tutAdvance();
  $("tutBar").style.width = need ? Math.min(100, tutHold / need * 100) + "%" : "0%";
}
function tutAdvance() {
  if (tutStep >= TUT_STEPS.length - 1) return;
  tutStep++; tutHold = 0; Sound.play("step"); renderTut();
  if (tutStep === 5) burst(P.x, P.y, "#facc15", 30);
}
function renderTut() {

  if (!tm.innerHTML) tm.innerHTML = mascotSVG();
  $("tutText").innerHTML = st[SET.lang] + (st.kind === "btn" ? `<div style="margin-top:8px"><button class="cbtn primary" id="tutNext">${T("nextBtn")}</button></div>` : "");

  $("tutStepNo").textContent = `${tutStep + 1}/${TUT_STEPS.length}`;

// =====================================================================
//  BOSS: THE CYCLOTRON CORE
// =====================================================================
function setupBoss() {
  mapW = mapH = 0; grid = []; orbs = []; portal = null;
  const r0 = BOSS.m * BOSS.v / (BOSS.q * BOSS.B);
  checkpoint = { x: 0, y: r0, vx: BOSS.v, vy: 0, q: BOSS.q };
  boss = { proj: [], emitT: 2.5, emitA: 0, hits: 0, kicks: 0, kickBuf: -9, inGap: false, kicked: false, inv: 0, phase: 1, ready: false, won: false, winT: 0, coreFlash: 0 };
  dust = Array.from({ length: 70 }, () => ({ x: (Math.random() - .5) * 16, y: (Math.random() - .5) * 16, vx: (Math.random() - .5) * .15, vy: (Math.random() - .5) * .15, r: .02 + Math.random() * .05, ph: Math.random() * 6 }));
  respawn(); cam.x = 0; cam.y = 0;
}
function bossEnergy() { return Math.max(0, Math.min(1, (speed(P) - BOSS.v) / (BOSS.vTarget - BOSS.v))); }
function requestKick() { if (mode === "boss" && state === "play" && boss) { boss.kickBuf = timeT; $("padK").classList.add("on"); setTimeout(() => $("padK").classList.remove("on"), 120); } }

function updateBoss(dt) {
  const b = boss;
  if (b.won) { b.winT -= dt; if (b.winT <= 0) { b.won = false; levelDone(); } return; }
  Bnow = -BOSS.B * (1 + .35 * (keyL ? 1 : 0) - .35 * (keyR ? 1 : 0));
  timeT += dt; trackStats(dt);
  if (b.inv > 0) b.inv -= dt;
  const n = Math.ceil(dt / SUB), h = dt / n;
  for (let i = 0; i < n; i++) {
    rotateVelocity(P, Bnow, h);
    P.x += P.vx * h; P.y += P.vy * h;
    const d = Math.hypot(P.x, P.y), ing = Math.abs(P.x) < BOSS.gap;
    if (ing && !b.inGap) { b.inGap = true; b.kicked = false; }
    if (!ing && b.inGap) b.inGap = false;
    if (ing && !b.kicked && timeT - b.kickBuf < .35) doKick();
    if (d < .62) bossHit(true);
    if (d > BOSS.R) {
      if (speed(P) >= BOSS.vTarget) { bossWin(); return; }
      // containment field: re-centre the orbit (r = mv/qB around the core) with a small speed loss
      const v = Math.max(BOSS.v, speed(P) * .9), r = P.m * v / (Math.abs(P.q) * BOSS.B);
      burst(P.x, P.y, "#fb7185", 30); Sound.play("hit"); flash = { c: "251,113,133", t: .3 }; if (SET.shake) shake = .25;
      addScore(-PTS_CRASH, P.x, P.y - .5); P.x = 0; P.y = r; P.vx = v; P.vy = 0; trail = []; b.hits++; b.inv = 1;
      toast(SET.lang === "id" ? "Medan pengaman mengembalikan orbit ke tengah. Laju ↓" : "Containment field re-centred your orbit. Speed ↓", "#fb7185");
      break;
    }
  }
  // projectiles
  for (const p of b.proj) { p.x += p.vx * dt; p.y += p.vy * dt; p.tr.push([p.x, p.y]); if (p.tr.length > 8) p.tr.shift();
    if (b.inv <= 0 && Math.hypot(p.x - P.x, p.y - P.y) < .38) { p.dead = true; bossHit(false); } }
  b.proj = b.proj.filter(p => !p.dead && Math.hypot(p.x, p.y) < BOSS.R + .6);
  // phases and emission
  const e = bossEnergy(), ph = e < .35 ? 1 : e < .7 ? 2 : 3;
  if (ph !== b.phase) { b.phase = ph; banner(`${T("phase")} ${ph}`, ph === 2 ? "Overload" : "Meltdown"); Sound.play("alarm"); }
  if (!b.ready && speed(P) >= BOSS.vTarget) { b.ready = true; toast(T("extraction"), "#5dff9e"); Sound.play("check"); }
  b.emitT -= dt;
  if (b.emitT <= 0) {
    const arms = [1, 2, 3][ph - 1], spd = 1.5 + ph * .2;
    b.emitT = [1.5, 1.1, .85][ph - 1];
    for (let k = 0; k < arms; k++) {
      const a = b.emitA + k * Math.PI * 2 / arms;
      b.proj.push({ x: Math.cos(a) * .7, y: Math.sin(a) * .7, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, tr: [] });
    }
    b.emitA += ph === 3 ? .55 : .38; b.coreFlash = .25;
  }
  if (b.coreFlash > 0) b.coreFlash -= dt;
  trail.push([P.x, P.y]); if (trail.length > 160) trail.shift();
}
function doKick() {
  const b = boss; b.kicked = true; b.kicks++;
  const before = speed(P); setSpeed(P, Math.min(11, before * 1.15));
  burst(P.x, P.y, "#5dff9e", 26); Sound.play("kick"); flash = { c: "93,255,158", t: .25 };
  popup(P.x, P.y - .5, `+${(.5 * (P.m / 1000) * (speed(P) ** 2 - before ** 2) * 1000).toFixed(1)} mJ`, "#5dff9e");
}
function bossHit(core) {
  const b = boss; if (b.inv > 0) return;
  b.inv = 1.6; b.hits++;
  setSpeed(P, Math.max(BOSS.v, speed(P) * .93));
  if (SET.shake) shake = .3; burst(P.x, P.y, "#ff5d5d", 30); Sound.play("hit"); flash = { c: "255,93,93", t: .3 };
  toast(T("hit"), "#ff5d5d");
}
function bossWin() {
  const b = boss; b.won = true; b.winT = 1.8; b.proj = [];
  Sound.play("boom"); if (SET.shake) shake = 1;
  for (let k = 0; k < 4; k++) burst(0, 0, ["#fb7185", "#facc15", "#ffffff", "#a78bfa"][k], 70);
  banner("CYCLOTRON", T("bossWin"));

  ctx.strokeStyle = boss.ready ? "#5dff9e" : theme.edge; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = SET.hq ? 18 * dpr : 0; ctx.lineWidth = 3 * dpr;
  ctx.setLineDash(boss.ready ? [14 * dpr, 10 * dpr] : []); ctx.lineDashOffset = -t * 40 * dpr;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); ctx.shadowBlur = 0;
  for (let k = 0; k < 24; k++) { const a = k * Math.PI / 12; ctx.fillStyle = "#9aa6ba"; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * (R + scale * .25), cy + Math.sin(a) * (R + scale * .25), scale * .06, 0, 7); ctx.fill(); }

let attract = [];
function makeAttract() {
  const cols = ["#ff6b6b", "#4dd8ff", "#facc15", "#a78bfa", "#5dff9e", "#f472b6", "#fb923c", "#4fd6ff"];
  attract = Array.from({ length: 10 }, (_, i) => {
    const sgn = i % 2 ? -1 : 1, sp = (60 + Math.random() * 90) * dpr;
    return { x: Math.random() * W, y: H * (.12 + .76 * (i / 9)), vx: sp, vy: 0, w: sgn * (.9 + Math.random() * .8), col: sgn > 0 ? cols[i % 8] : cols[(i + 3) % 8], tr: [] };
  });
}
function drawAttract(t, dt) {
  theme = THEMES[0]; scale = baseScale;
  drawBackground(t, Math.sin(t * .05) * 20, Math.cos(t * .04) * 10);
  const step = 64 * dpr;
  ctx.strokeStyle = "rgba(91,134,255,.1)"; ctx.lineWidth = 1.5 * dpr;
  for (let x = step / 2; x < W; x += step) for (let y = step / 2; y < H; y += step) {
    const s = 5 * dpr * (1 + .25 * Math.sin(t * 1.5 + x * .01 + y * .01));
    ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.stroke();
  }

    const n = 4, h = dt / n;

      const c = Math.cos(p.w * h), s = Math.sin(p.w * h);
      const vx = p.vx * c - p.vy * s, vy = p.vx * s + p.vy * c;
      p.vx = vx; p.vy = vy + Math.sign(p.w) * E * h;
      p.x += p.vx * h; p.y += p.vy * h;
    }
    if (p.x > W + 60) { p.x -= W + 120; p.tr = []; } if (p.x < -60) { p.x += W + 120; p.tr = []; }
    p.tr.push([p.x, p.y]); if (p.tr.length > 160) p.tr.shift();
    ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
    for (let i = 1; i < p.tr.length; i++) {
      ctx.strokeStyle = p.col; ctx.globalAlpha = i / p.tr.length * .7; ctx.lineWidth = (1 + 3 * i / p.tr.length) * dpr;
      ctx.beginPath(); ctx.moveTo(p.tr[i - 1][0], p.tr[i - 1][1]); ctx.lineTo(p.tr[i][0], p.tr[i][1]); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 16 * dpr);
    g.addColorStop(0, "#fff"); g.addColorStop(.3, p.col); g.addColorStop(1, p.col + "00");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 16 * dpr, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .8);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.6)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// =====================================================================
//  RENDER: frame
// =====================================================================
const inGame = () => ["play", "lesson", "done", "paused", "tutdone", "finale"].includes(state) && P;
function draw(now, dt) {
  const t = now / 1000;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!inGame()) { drawAttract(t, dt); return; }
  if (mode === "boss") { scale = Math.min(W, H) / 15.5; cam.x = 0; cam.y = 0; }
  else {
    scale = baseScale;
    const tx = P.x + P.vx * .35, ty = P.y + P.vy * .35;
    cam.x += (tx - cam.x) * Math.min(1, dt * 5); cam.y += (ty - cam.y) * Math.min(1, dt * 5);
  }
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 18 * dpr * shake, (Math.random() - .5) * 18 * dpr * shake);
  drawBackground(t, cam.x, cam.y);
  if (state === "play" && Bnow !== 0 && deadT <= 0) {
    const col = Bnow < 0 ? "91,134,255" : "255,166,61";

  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.5)"); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

function drawFX(dt) {

        <small style="opacity:.75">${T("scoreRule")}</small></div>
      <div class="bigstars">${[0, 1, 2].map(k => `<span class="${k < s ? "on" : ""}" style="animation-delay:${.2 + k * .25}s">★</span>`).join("")}</div>

      <div class="debrief">
        <div><small>${T("time")}</small><b>${timeT.toFixed(1)} s</b></div>
        <div><small>${mode === "boss" ? T("dHits") : T("orbs")}</small><b class="nb">${mode === "boss" ? boss.hits : collected + "/" + orbs.length}</b></div>
        <div><small>${mode === "boss" ? T("dKicks") : T("crashes")}</small><b>${mode === "boss" ? boss.kicks : crashes}</b></div>
        <div><small>${T("dBest")}</small><b>${mode !== "custom" && PROG.best[idx] ? PROG.best[idx].toFixed(1) + " s" : "—"}</b></div>
        <div><small>${T("dMaxV")}</small><b>${stats.maxV.toFixed(2)} m/s</b></div>
        <div><small>${T("dMaxF")}</small><b>${stats.maxF.toFixed(1)} mN</b></div>

// =====================================================================
const ED = { w: 32, h: 18, grid: null, tool: "#", name: "", theme: 1, editIdx: -1, hover: null, painting: 0, armDel: -1 };
const TOOL_LIST = [["#", "▦", "#5a667c"], [".", "⌫", "#1b2230"], ["S", "▶", "#ff6b6b"], ["E", "◎", "#a78bfa"], ["o", "●", "#facc15"], ["C", "CP", "#4fd6ff"], ["A", "⚡+", "#5dff9e"], ["D", "⚡−", "#c084fc"], ["F", "±", "#f472b6"]];
function edBlank() { const g = []; for (let y = 0; y < ED.h; y++) { const r = []; for (let x = 0; x < ED.w; x++) r.push(x === 0 || y === 0 || x === ED.w - 1 || y === ED.h - 1 ? "#" : "."); g.push(r); } return g; }
function edToMap() { return ED.grid.map(r => r.join("")); }
const enc = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const dec = b => new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0)));
function edCount(ch) { let n = 0; for (const r of ED.grid) for (const c of r) if (c === ch) n++; return n; }

function showEditor(level, idx) {
  if (level) { ED.grid = level.map.map(r => r.split("")); ED.h = ED.grid.length; ED.w = ED.grid[0].length; ED.name = level.name || ""; ED.theme = level.theme || 1; ED.editIdx = idx ?? -1; }
  if (!ED.grid) ED.grid = edBlank();
  state = "editor"; showScreen("editor"); returnTo = "editor";
  $("editor").innerHTML = `<div class="wrap" style="max-width:1400px">
    <div class="titlebar console"><button class="cbtn back">${T("back")}</button><h2>${T("edTitle")}<small>${T("edSub")} · ${ED.w}×${ED.h} m</small></h2>
      <button class="cbtn primary" id="edTest">▶ ${T("edTest")}</button><button class="cbtn" id="edSave">💾 ${T("edSave")}</button></div>
    <div class="edgrid">
      <div class="console screw">${head(T("edTools"), "")}<div class="tools">${TOOL_LIST.map(([k, ic, col]) =>
        `<button class="tool ${ED.tool === k ? "active" : ""}" data-tool="${k}"><span class="ic" style="background:${col}22;color:${col};border:1px solid ${col}88">${ic}</span>${T("tools")[k]}</button>`).join("")}</div></div>
      <div class="console screw">${head("BLUEPRINT", "GRID 1 m")}<div style="padding:8px"><div class="screen-glass"><canvas id="edCanvas"></canvas></div></div><div class="edhint">${T("edHint")}</div></div>
      <div class="edside">
        <div class="console screw">${head(T("edName"), "")}<div class="body"><input type="text" id="edName" maxlength="40" placeholder="${T("untitled")}" value="${ED.name.replace(/"/g, "&quot;")}">
          <div class="seg" id="edTheme">${THEMES.slice(0, 5).map((th, i) => `<button data-th="${i}" class="${ED.theme === i ? "active" : ""}" style="border-bottom:3px solid ${th.edge}">${th.name.split(" ")[0]}</button>`).join("")}</div></div></div>
        <div class="console screw">${head(T("edCheck"), "")}<div class="body" id="edChecks"></div></div>
        <div class="console screw">${head(T("edShare"), "MD1")}<div class="body">
          <div class="btnrow"><button class="cbtn" id="edShareB">📤 ${T("edShare")}</button><button class="cbtn" id="edNew">🗑 ${T("edNew")}</button></div>
          <textarea id="edCode" placeholder="MD1:..."></textarea>
          <div class="btnrow"><button class="cbtn" id="edCopy">${T("edCopy")}</button><button class="cbtn" id="edLoad">📥 ${T("edLoad")}</button></div></div></div>
        <div class="console screw">${head(T("edSaved"), CUSTOM.length + "")}<div class="body"><div class="slist" id="edList"></div></div></div>
      </div></div></div>`;
  const root = $("editor");
  root.querySelector(".back").onclick = () => { Sound.play("click"); showMenu(); };
  root.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => { ED.tool = b.dataset.tool; Sound.play("click"); root.querySelectorAll("[data-tool]").forEach(x => x.classList.toggle("active", x === b)); });
  root.querySelectorAll("[data-th]").forEach(b => b.onclick = () => { ED.theme = +b.dataset.th; Sound.play("click"); root.querySelectorAll("[data-th]").forEach(x => x.classList.toggle("active", x === b)); edDraw(); });
  $("edName").oninput = e => { ED.name = e.target.value; };
  $("edTest").onclick = () => {
    if (!edCount("S") || !edCount("E")) { Sound.play("wrong"); toast(T("edNeed"), "#ff5d5d"); return; }
    Sound.play("click"); returnTo = "editor";
    showLesson("custom", 0, { theme: ED.theme, B: 2, v: 3, q: 2, m: 2, map: edToMap(), name: ED.name || T("untitled"), diff: 2 });
  };
  $("edSave").onclick = () => {
    if (!edCount("S") || !edCount("E")) { Sound.play("wrong"); toast(T("edNeed"), "#ff5d5d"); return; }
    const lv = { name: ED.name || T("untitled"), theme: ED.theme, map: edToMap() };
    if (ED.editIdx >= 0 && CUSTOM[ED.editIdx]) CUSTOM[ED.editIdx] = lv; else { CUSTOM.push(lv); ED.editIdx = CUSTOM.length - 1; }
    saveCustom(); Sound.play("check"); toast(T("edSavedMsg"), "#5dff9e"); edList();
  };
  $("edNew").onclick = () => { ED.grid = edBlank(); ED.name = ""; ED.editIdx = -1; $("edName").value = ""; Sound.play("click"); edDraw(); edChecks(); };
  $("edShareB").onclick = () => { $("edCode").value = "MD1:" + enc(JSON.stringify({ n: ED.name, t: ED.theme, m: edToMap() })); $("edCode").select(); Sound.play("click"); };
  $("edCopy").onclick = async () => {
    const ta = $("edCode"); if (!ta.value) $("edShareB").click();
    try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); try { document.execCommand("copy"); } catch (e2) {} }
    toast(T("edCopied"), "#5dff9e"); Sound.play("check");
  };
  $("edLoad").onclick = () => {
    try {
      const raw = $("edCode").value.trim().replace(/^MD1:/, ""), o = JSON.parse(dec(raw));
      if (!Array.isArray(o.m) || !o.m.length || o.m.some(r => typeof r !== "string" || r.length !== o.m[0].length || /[^#.SEoCADF]/.test(r)) || o.m.length > 40 || o.m[0].length > 60) throw 0;
      ED.grid = o.m.map(r => r.split("")); ED.h = ED.grid.length; ED.w = ED.grid[0].length; ED.name = String(o.n || "").slice(0, 40); ED.theme = Math.min(4, Math.max(0, +o.t || 0)); ED.editIdx = -1;
      Sound.play("check"); toast(T("edLoaded"), "#5dff9e"); showEditor();
    } catch (e) { Sound.play("wrong"); toast(T("edBad"), "#ff5d5d"); }
  };
  const c = $("edCanvas");
  const cellFromEvent = e => { const r = c.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / r.width * ED.w), Math.floor((e.clientY - r.top) / r.height * ED.h)]; };
  const paint = (x, y, erase) => {
    if (x <= 0 || y <= 0 || x >= ED.w - 1 || y >= ED.h - 1) return;
    const t = erase ? "." : ED.tool;
    if (t === "S") for (const r of ED.grid) for (let i = 0; i < r.length; i++) if (r[i] === "S") r[i] = ".";
    if (ED.grid[y][x] !== t) { ED.grid[y][x] = t; edDraw(); edChecks(); }
  };
  c.addEventListener("contextmenu", e => e.preventDefault());
  c.addEventListener("pointerdown", e => { e.preventDefault(); c.setPointerCapture(e.pointerId); ED.painting = e.button === 2 ? 2 : 1; const [x, y] = cellFromEvent(e); paint(x, y, ED.painting === 2); Sound.play("click"); });
  c.addEventListener("pointermove", e => { const [x, y] = cellFromEvent(e); ED.hover = [x, y]; if (ED.painting) paint(x, y, ED.painting === 2); else edDraw(); });
  c.addEventListener("pointerup", () => { ED.painting = 0; });
  c.addEventListener("pointerleave", () => { ED.hover = null; edDraw(); });
  requestAnimationFrame(() => { edDraw(); edChecks(); edList(); });
}
function edDraw() {
  const c = $("edCanvas"); if (!c) return;
  const cw = c.clientWidth * dpr, cs = Math.floor(cw / ED.w); c.width = cs * ED.w; c.height = cs * ED.h;
  c.style.aspectRatio = `${ED.w} / ${ED.h}`;
  const g = c.getContext("2d"), th = THEMES[ED.theme];
  const gr = g.createLinearGradient(0, 0, 0, c.height); gr.addColorStop(0, th.top); gr.addColorStop(1, th.bot); g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height);
  for (let y = 0; y < ED.h; y++) for (let x = 0; x < ED.w; x++) {
    const ch = ED.grid[y][x], X = x * cs, Y = y * cs;
    if (ch === "#") { const mg = g.createLinearGradient(X, Y, X + cs, Y + cs); mg.addColorStop(0, th.steel[0]); mg.addColorStop(1, th.steel[1]); g.fillStyle = mg; g.fillRect(X, Y, cs, cs);
      g.strokeStyle = "rgba(255,255,255,.08)"; g.strokeRect(X + 2, Y + 2, cs - 4, cs - 4); continue; }
    g.fillStyle = "rgba(10,14,22,.55)"; g.fillRect(X, Y, cs, cs);
    g.textAlign = "center"; g.textBaseline = "middle"; g.font = `700 ${cs * .45}px Rajdhani, sans-serif`;
    if ("ADF".includes(ch)) { const col = { A: "#5dff9e", D: "#c084fc", F: "#f472b6" }[ch]; g.fillStyle = col + "44"; g.fillRect(X, Y, cs, cs); g.fillStyle = col; g.fillText({ A: "⚡+", D: "⚡−", F: "±" }[ch], X + cs / 2, Y + cs / 2); }
    else if (ch === "o") { g.fillStyle = "#facc15"; g.beginPath(); g.arc(X + cs / 2, Y + cs / 2, cs * .22, 0, 7); g.fill(); }
    else if (ch === "E") { g.fillStyle = "#a78bfa66"; g.fillRect(X, Y, cs, cs); g.strokeStyle = "#e9d5ff"; g.beginPath(); g.arc(X + cs / 2, Y + cs / 2, cs * .32, 0, 7); g.stroke(); }
    else if (ch === "S") { g.fillStyle = "#ff6b6b"; g.beginPath(); g.arc(X + cs / 2, Y + cs / 2, cs * .3, 0, 7); g.fill(); g.strokeStyle = "#5dff9e"; g.lineWidth = 2;
      g.beginPath(); g.moveTo(X + cs * .6, Y + cs / 2); g.lineTo(X + cs * 1.4, Y + cs / 2); g.stroke(); g.lineWidth = 1; }
    else if (ch === "C") { g.strokeStyle = "#4fd6ff"; g.beginPath(); g.arc(X + cs / 2, Y + cs / 2, cs * .3, 0, 7); g.stroke(); g.fillStyle = "#4fd6ff"; g.font = `${cs * .28}px Share Tech Mono, monospace`; g.fillText("CP", X + cs / 2, Y + cs / 2); }
  }
  g.strokeStyle = "rgba(93,255,158,.1)"; g.lineWidth = 1;
  for (let x = 0; x <= ED.w; x++) { g.beginPath(); g.moveTo(x * cs + .5, 0); g.lineTo(x * cs + .5, c.height); g.stroke(); }
  for (let y = 0; y <= ED.h; y++) { g.beginPath(); g.moveTo(0, y * cs + .5); g.lineTo(c.width, y * cs + .5); g.stroke(); }
  // turning-radius guide (r = 1.5 m) next to the start, to help design corridors
  for (let y = 0; y < ED.h; y++) for (let x = 0; x < ED.w; x++) if (ED.grid[y][x] === "S") {
    g.strokeStyle = "rgba(91,134,255,.5)"; g.setLineDash([4, 4]); g.beginPath(); g.arc((x + .5) * cs, (y + .5 - 1.5) * cs, 1.5 * cs, 0, 7); g.stroke(); g.setLineDash([]);
  }
  if (ED.hover) { const [x, y] = ED.hover; g.strokeStyle = "#ffb547"; g.lineWidth = 2; g.strokeRect(x * cs + 1, y * cs + 1, cs - 2, cs - 2); }
}
function edChecks() {
  const el = $("edChecks"); if (!el) return;
  const s = edCount("S"), e = edCount("E"), o = edCount("o");
  el.innerHTML = `<div class="check"><span>${T("edStart")}</span><span class="${s ? "ok" : "bad"}">${s ? "✔ OK" : "✖"}</span></div>
    <div class="check"><span>${T("edPortal")}</span><span class="${e ? "ok" : "bad"}">${e ? "✔ " + e : "✖"}</span></div>
    <div class="check"><span>${T("edOrbs")}</span><span class="ok">${o}</span></div>
    <div class="check"><span>r (v=3, B=2)</span><span style="color:var(--cyan)">1.50 m</span></div>`;
}
function edList() {
  const el = $("edList"); if (!el) return;
  el.innerHTML = CUSTOM.length ? CUSTOM.map((c, i) => `<div class="sitem"><span>${c.name || T("untitled")}</span>
    <button class="cbtn" data-e="${i}">✎</button><button class="cbtn" data-p="${i}">▶</button><button class="cbtn danger" data-d="${i}">${ED.armDel === i ? T("edSureDel") : T("edDel")}</button></div>`).join("")
    : `<div class="muted">${T("edNone")}</div>`;
  el.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { Sound.play("click"); showEditor(CUSTOM[+b.dataset.e], +b.dataset.e); });
  el.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { Sound.play("click"); returnTo = "editor"; showLesson("custom", 0, customDef(CUSTOM[+b.dataset.p])); });
  el.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
    const i = +b.dataset.d;
    if (ED.armDel !== i) { ED.armDel = i; edList(); return; }
    CUSTOM.splice(i, 1); saveCustom(); ED.armDel = -1; if (ED.editIdx === i) ED.editIdx = -1; else if (ED.editIdx > i) ED.editIdx--;
    Sound.play("crash"); edList();
  });
}

// =====================================================================
//  INPUT
// =====================================================================
const isTyping = e => ["INPUT", "TEXTAREA"].includes(e.target.tagName);
addEventListener("keydown", e => {
  if (isTyping(e)) return;
  Sound.init();
  if (["ArrowLeft", "KeyA"].includes(e.code)) { keyL = true; e.preventDefault(); }
  if (["ArrowRight", "KeyD"].includes(e.code)) { keyR = true; e.preventDefault(); }
  if ((e.code === "Escape" || e.code === "KeyP") && state === "play") { showPause(); return; }
  if (e.code === "Escape" && state === "paused") { $("pr")?.click(); return; }
  if (state === "play" && mode === "boss" && ["Space", "KeyW", "ArrowUp"].includes(e.code)) { e.preventDefault(); if (!e.repeat) requestKick(); return; }
  if (e.code === "Enter" || e.code === "Space") {
    if (modal.classList.contains("show")) { const b = card.querySelector(".cbtn.primary"); if (b) { e.preventDefault(); b.click(); } }
    else if (state === "play" && mode === "tut" && TUT_STEPS[tutStep].kind === "btn") { e.preventDefault(); Sound.play("click"); tutAdvance(); }
  }
});
addEventListener("keyup", e => {
  if (["ArrowLeft", "KeyA"].includes(e.code)) keyL = false;
  if (["ArrowRight", "KeyD"].includes(e.code)) keyR = false;
});
addEventListener("blur", () => { keyL = keyR = false; if (state === "play") showPause(); });
function holdButton(el, set) {
  el.addEventListener("pointerdown", e => { e.preventDefault(); Sound.init(); el.setPointerCapture(e.pointerId); set(true); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) el.addEventListener(ev, () => set(false));
  el.addEventListener("contextmenu", e => e.preventDefault());
}
holdButton($("padL"), v => keyL = v);
holdButton($("padR"), v => keyR = v);
$("padK").addEventListener("pointerdown", e => { e.preventDefault(); Sound.init(); requestKick(); });
cv.addEventListener("pointerdown", e => { if (state !== "play") return; cv.setPointerCapture(e.pointerId); if (e.clientX < innerWidth / 2) keyL = true; else keyR = true; });
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, () => { keyL = keyR = false; });
$("pauseBtn").onclick = () => { Sound.play("click"); showPause(); };

// =====================================================================
//  LOOP
// =====================================================================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= .95; s.vy *= .95; s.life -= dt; }
  sparks = sparks.filter(s => s.life > 0);
  for (const p of popups) p.life -= dt; popups = popups.filter(p => p.life > 0);
  for (const d of dust) { d.x += d.vx * dt; d.y += d.vy * dt;
    if (mode !== "boss" && mapW) { if (d.x < 0) d.x += mapW; if (d.x > mapW) d.x -= mapW; if (d.y < 0) d.y += mapH; if (d.y > mapH) d.y -= mapH; } }
  if (shake > 0) shake = Math.max(0, shake - dt);
  if (flash) { flash.t -= dt; if (flash.t <= 0) flash = null; }
  if (state !== "play") Bnow = 0;
  Sound.setHum(state === "play" && deadT <= 0 ? Bnow : 0);
  factTimer += dt; if (factTimer > 9) { factTimer = 0; factIdx++; if (state === "menu") renderFact(); }
  draw(now, dt); drawFX(dt); updateHUD(now / 1000);
  requestAnimationFrame(loop);
}
addEventListener("resize", () => { resize(); if (state === "menu") makeAttract(); if (state === "editor") edDraw(); });
resize(); applyBodyClasses();
showMenu();
requestAnimationFrame(loop);
</script>
